<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="auto" class="rounded-xl shadow-md border border-border" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="usHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Top Window Header -->
  <rect x="0" y="0" width="820" height="42" fill="#1E293B" rx="8" ry="8"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="84" y="26" fill="#F8FAFC" font-size="12" font-weight="700">U.S. Department of State · Official Passport Photo Biometric Dimensions</text>
  <rect x="670" y="10" width="134" height="22" rx="4" fill="#2563EB"/>
  <text x="682" y="25" fill="#FFFFFF" font-size="10.5" font-weight="700">2×2 INCHES (1:1)</text>

  <!-- Title Banner -->
  <rect x="20" y="54" width="780" height="48" rx="8" fill="url(#usHeaderGrad)"/>
  <text x="38" y="84" fill="#FFFFFF" font-size="14.5" font-weight="800">US PASSPORT PHOTO SPECIFICATION GUIDE: 2×2 IN (600×600 TO 1200×1200 PX)</text>
  <text x="652" y="84" fill="#BFDBFE" font-size="11.5" font-weight="600">300 – 600 DPI</text>

  <!-- Main Card -->
  <rect x="20" y="114" width="780" height="326" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <!-- Left: Visual 2x2 Photo Box with Geometric Head Guidelines -->
  <rect x="36" y="130" width="280" height="294" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="50" y="152" fill="#93C5FD" font-size="12" font-weight="700">Official 2" × 2" (51 × 51 mm) Geometry</text>

  <!-- The 2x2 Photo Canvas Frame -->
  <g transform="translate(66, 168)">
    <!-- Photo Area (Square 220x220) -->
    <rect x="0" y="0" width="220" height="220" fill="url(#photoBg)" stroke="#2563EB" stroke-width="2" rx="4"/>

    <!-- Center vertical reference dashed line -->
    <line x1="110" y1="0" x2="110" y2="220" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Eye level reference band (1 1/8" to 1 3/8" from bottom -> 56% to 69% from bottom -> 68 to 97 px from top) -->
    <rect x="10" y="74" width="200" height="28" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="10" y1="88" x2="210" y2="88" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Silhouette / Head Representation -->
    <!-- Shoulders -->
    <path d="M 40 220 C 50 185, 80 178, 110 178 C 140 178, 170 185, 180 220 Z" fill="#64748B" fill-opacity="0.35"/>
    <!-- Neck -->
    <rect x="94" y="146" width="32" height="36" fill="#CBD5E1" rx="2"/>
    <!-- Head Oval (Head height 120px = 54.5% of 220px) -->
    <ellipse cx="110" cy="102" rx="42" ry="58" fill="#F1F5F9" stroke="#0284C7" stroke-width="2"/>
    <!-- Eyes marker -->
    <circle cx="94" cy="88" r="3.5" fill="#0369A1"/>
    <circle cx="126" cy="88" r="3.5" fill="#0369A1"/>
    <!-- Nose & Mouth hint -->
    <path d="M 110 94 L 110 106 L 105 109 L 115 109" fill="none" stroke="#64748B" stroke-width="1.2"/>
    <line x1="102" y1="124" x2="118" y2="124" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Head Height Measurement Dimension Bracket (Right Side) -->
    <line x1="168" y1="44" x2="194" y2="44" stroke="#DC2626" stroke-width="1.5"/>
    <line x1="168" y1="160" x2="194" y2="160" stroke="#DC2626" stroke-width="1.5"/>
    <line x1="190" y1="44" x2="190" y2="160" stroke="#DC2626" stroke-width="1.5"/>
    <!-- Bracket Arrows -->
    <polygon points="190,44 187,52 193,52" fill="#DC2626"/>
    <polygon points="190,160 187,152 193,152" fill="#DC2626"/>

    <!-- Head Height Label Tag -->
    <rect x="134" y="93" width="78" height="18" rx="3" fill="#DC2626"/>
    <text x="139" y="106" fill="#FFFFFF" font-size="9" font-weight="700">1" – 1⅜" (50–69%)</text>

    <!-- Dimension indicator 2" x 2" -->
    <text x="110" y="212" fill="#475569" font-size="10" font-weight="700" text-anchor="middle">2 × 2 in (51 × 51 mm)</text>
  </g>

  <!-- Right: Official State Department Rules and Breakdown -->
  <rect x="332" y="130" width="452" height="294" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="350" y="155" fill="#F8FAFC" font-size="13" font-weight="700">US Department of State Mandatory Criteria</text>

  <!-- Spec Grid Rows -->
  <g transform="translate(350, 172)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="416" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="21" fill="#93C5FD" font-size="11" font-weight="700">Head Proportion:</text>
    <text x="135" y="21" fill="#F8FAFC" font-size="11">Between 1 in. and 1⅜ in. (25–35 mm) from chin to top of hair (50–69%)</text>

    <!-- Row 2 -->
    <rect x="0" y="42" width="416" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="63" fill="#93C5FD" font-size="11" font-weight="700">Eye Height:</text>
    <text x="135" y="63" fill="#F8FAFC" font-size="11">Between 1⅛ in. and 1⅜ in. (28–35 mm) from the bottom of the photo</text>

    <!-- Row 3 -->
    <rect x="0" y="84" width="416" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="105" fill="#93C5FD" font-size="11" font-weight="700">Background:</text>
    <text x="135" y="105" fill="#F8FAFC" font-size="11">Plain white or off-white with NO shadows, textures, or objects</text>

    <!-- Row 4 -->
    <rect x="0" y="126" width="416" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="147" fill="#EF4444" font-size="11" font-weight="700">Eyeglasses:</text>
    <text x="135" y="147" fill="#FCA5A5" font-size="11" font-weight="700">NO GLASSES (strictly prohibited unless signed medical waiver)</text>

    <!-- Row 5 -->
    <rect x="0" y="168" width="416" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="189" fill="#93C5FD" font-size="11" font-weight="700">Expression &amp; Head:</text>
    <text x="135" y="189" fill="#F8FAFC" font-size="11">Neutral expression or natural smile, both eyes open, full face facing front</text>

    <!-- Row 6 -->
    <rect x="0" y="210" width="416" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="14" y="231" fill="#93C5FD" font-size="11" font-weight="700">Attire &amp; Recency:</text>
    <text x="135" y="231" fill="#F8FAFC" font-size="11">Normal street clothing (no uniforms or camouflage). Taken within 6 months</text>
  </g>
</svg>

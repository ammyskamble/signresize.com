<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" class="rounded-xl shadow-md border border-border" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <rect x="70" y="165" width="120" height="150" rx="6"/>
    </clipPath>
  </defs>

  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#1E293B" rx="8" ry="8"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="84" y="26" fill="#F8FAFC" font-size="12" font-weight="700">UPPSC RO/ARO 2026 · Official Passport Photograph Specifications</text>
  <rect x="670" y="10" width="116" height="22" rx="4" fill="#3B82F6"/>
  <text x="682" y="25" fill="#FFFFFF" font-size="10.5" font-weight="700">20 KB – 50 KB</text>

  <!-- Title Banner -->
  <rect x="20" y="54" width="760" height="48" rx="8" fill="url(#photoGrad)"/>
  <text x="40" y="84" fill="#FFFFFF" font-size="15" font-weight="800">PASSPORT PHOTO SPECIFICATION &amp; FRAMING RULES</text>
  <text x="560" y="84" fill="#BFDBFE" font-size="12" font-weight="600">Advt. No. A-4/E-1/2026</text>

  <!-- Main Grid -->
  <rect x="20" y="114" width="760" height="286" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <!-- Left: Visual Sample Card -->
  <rect x="36" y="130" width="220" height="254" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="48" y="152" fill="#60A5FA" font-size="11.5" font-weight="700">75% Face Coverage Preview</text>

  <!-- Photo Box -->
  <g clip-path="url(#avatarClip)">
    <rect x="70" y="165" width="120" height="150" fill="#E2E8F0"/>
    <!-- Head & Shoulders silhouette -->
    <circle cx="130" cy="215" r="32" fill="#475569"/>
    <path d="M 90 285 C 90 248, 170 248, 170 285 Z" fill="#334155"/>
    <ellipse cx="130" cy="285" rx="42" ry="16" fill="#1E293B"/>
    <!-- Eyes and ears guide lines -->
    <line x1="85" y1="210" x2="175" y2="210" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="180" y="213" fill="#38BDF8" font-size="8">Eye Level</text>
  </g>
  <!-- Frame border with dimension labels -->
  <rect x="70" y="165" width="120" height="150" fill="none" stroke="#22C55E" stroke-width="2" rx="6"/>
  <text x="100" y="332" fill="#F8FAFC" font-size="11" font-weight="700">3.5 × 4.5 cm</text>
  <text x="75" y="348" fill="#94A3B8" font-size="9.5">(Physical: 5 × 6 cm @ 200 DPI)</text>
  <rect x="52" y="358" width="188" height="18" rx="3" fill="#14532D"/>
  <text x="76" y="371" fill="#4ADE80" font-size="9.5" font-weight="700">✓ Accepted by OTR Portal</text>

  <!-- Center & Right: Specs & Checklist -->
  <rect x="272" y="130" width="492" height="254" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="290" y="155" fill="#F8FAFC" font-size="13" font-weight="700">Official UPPSC OTR Photo Guidelines Summary</text>

  <!-- Spec items table-like rows -->
  <rect x="290" y="170" width="456" height="34" rx="4" fill="#1E293B"/>
  <text x="302" y="191" fill="#94A3B8" font-size="11">File Format &amp; Size:</text>
  <text x="430" y="191" fill="#34D399" font-size="11.5" font-weight="700">JPEG / JPG · 20 KB to 50 KB strictly</text>

  <rect x="290" y="210" width="456" height="34" rx="4" fill="#1E293B"/>
  <text x="302" y="231" fill="#94A3B8" font-size="11">Background:</text>
  <text x="430" y="231" fill="#F8FAFC" font-size="11.5" font-weight="600">Plain white or very light off-white (no scenery/colors)</text>

  <rect x="290" y="250" width="456" height="34" rx="4" fill="#1E293B"/>
  <text x="302" y="271" fill="#94A3B8" font-size="11">Framing &amp; Lighting:</text>
  <text x="430" y="271" fill="#F8FAFC" font-size="11.5" font-weight="600">Frontal view, both ears visible, neutral expression</text>

  <rect x="290" y="290" width="456" height="34" rx="4" fill="#1E293B"/>
  <text x="302" y="311" fill="#94A3B8" font-size="11">Eyeglasses &amp; Headgear:</text>
  <text x="430" y="311" fill="#F87171" font-size="11" font-weight="600">No dark goggles/caps; religious turbans allowed if face clear</text>

  <!-- Rejection warning alert -->
  <rect x="290" y="332" width="456" height="42" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
  <text x="304" y="348" fill="#FCA5A5" font-size="10" font-weight="700">⚠️ Common Disqualification Triggers:</text>
  <text x="304" y="363" fill="#FECACA" font-size="9.5">Selfies, mobile camera tilt, red-eye, shadow behind head, or files below 20 KB / above 50 KB.</text>
</svg>

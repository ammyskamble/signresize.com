<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="auto" class="rounded-xl shadow-md border border-border" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Card Frame -->
  <rect x="0" y="0" width="760" height="42" fill="#1E293B" rx="8" ry="8"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="80" y="26" fill="#94A3B8" font-size="12" font-weight="600">WBPSC Application Upload Verification &amp; Acknowledgement Status</text>

  <rect x="20" y="56" width="720" height="284" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <!-- Success Banner -->
  <rect x="40" y="74" width="680" height="56" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1.5"/>
  <circle cx="70" cy="102" r="16" fill="#10B981"/>
  <text x="62" y="108" fill="#FFFFFF" font-size="18" font-weight="800">✓</text>
  <text x="100" y="96" fill="#A7F3D0" font-size="14" font-weight="700">Images Validated &amp; Accepted by Portal</text>
  <text x="100" y="114" fill="#D1FAE5" font-size="11">Both photograph and signature meet WBPSC dimension and kilobyte specifications.</text>

  <!-- Two Columns for Validated Files -->
  <!-- Left: Photo Validated -->
  <rect x="40" y="142" width="330" height="130" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="56" y="156" width="60" height="78" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="86" cy="180" r="14" fill="#CBD5E1"/>
  <path d="M68 220 C72 198, 100 198, 104 220 Z" fill="#94A3B8"/>
  <text x="130" y="172" fill="#FFFFFF" font-size="12" font-weight="700">Photograph Status</text>
  <text x="130" y="190" fill="#34D399" font-size="11" font-weight="600">✓ Validated: 138 × 177 px</text>
  <text x="130" y="206" fill="#94A3B8" font-size="11">File Size: <tspan fill="#F8FAFC">48.2 KB (Allowed: 20–100 KB)</tspan></text>
  <text x="130" y="222" fill="#94A3B8" font-size="11">Format: <tspan fill="#F8FAFC">JPEG / Baseline</tspan></text>

  <!-- Right: Signature Validated -->
  <rect x="390" y="142" width="330" height="130" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="406" y="166" width="90" height="42" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <path d="M 414 190 Q 424 172 432 190 T 450 186 T 470 192" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <text x="510" y="172" fill="#FFFFFF" font-size="12" font-weight="700">Signature Status</text>
  <text x="510" y="190" fill="#34D399" font-size="11" font-weight="600">✓ Validated: 140 × 60 px</text>
  <text x="510" y="206" fill="#94A3B8" font-size="11">File Size: <tspan fill="#F8FAFC">14.6 KB (Allowed: 10–20 KB)</tspan></text>
  <text x="510" y="222" fill="#94A3B8" font-size="11">Format: <tspan fill="#F8FAFC">JPEG / High Quality</tspan></text>

  <!-- Next Step Action -->
  <rect x="40" y="284" width="680" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="56" y="310" fill="#94A3B8" font-size="11">Next Step: Proceed to Application Review, submit final declaration, and download Confirmation PDF.</text>
  <rect x="580" y="291" width="128" height="28" rx="4" fill="#2563EB"/>
  <text x="592" y="309" fill="#FFFFFF" font-size="11" font-weight="700">Proceed to Save →</text>
</svg>

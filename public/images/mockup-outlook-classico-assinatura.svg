<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="auto" class="rounded-xl shadow-xs border border-border" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="glowClassic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Window Header -->
  <rect x="0" y="0" width="760" height="42" fill="#1E293B" rx="10" ry="10"/>
  <rect x="0" y="32" width="760" height="10" fill="#1E293B"/>
  <circle cx="20" cy="21" r="5" fill="#EF4444"/>
  <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="21" r="5" fill="#10B981"/>
  <text x="75" y="26" fill="#94A3B8" font-size="12" font-weight="600">Microsoft Outlook Clássico (Desktop Windows)</text>

  <!-- Top Menu Bar with File Highlight -->
  <rect x="0" y="42" width="760" height="35" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="15" y="46" width="68" height="26" rx="4" fill="#2563EB"/>
  <text x="24" y="63" fill="#FFFFFF" font-size="11" font-weight="bold">Arquivo</text>
  <text x="100" y="63" fill="#94A3B8" font-size="11">Página Inicial</text>
  <text x="180" y="63" fill="#94A3B8" font-size="11">Enviar / Receber</text>
  <text x="275" y="63" fill="#94A3B8" font-size="11">Pasta</text>
  <text x="325" y="63" fill="#94A3B8" font-size="11">Exibir</text>

  <!-- Options Dialog Box -->
  <rect x="30" y="90" width="700" height="230" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>

  <!-- Options Window Header -->
  <rect x="30" y="90" width="700" height="32" fill="#334155" rx="8" ry="8"/>
  <rect x="30" y="112" width="700" height="10" fill="#334155"/>
  <text x="45" y="111" fill="#FFFFFF" font-size="12" font-weight="bold">Opções do Outlook</text>

  <!-- Left Sidebar -->
  <rect x="30" y="122" width="150" height="198" fill="#0F172A" opacity="0.5"/>
  <text x="45" y="145" fill="#94A3B8" font-size="11">Geral</text>
  
  <!-- Active "Email" tab -->
  <rect x="35" y="155" width="140" height="26" rx="5" fill="#2563EB"/>
  <text x="48" y="172" fill="#FFFFFF" font-size="11" font-weight="bold">✉️ Email (Passo 2)</text>
  
  <text x="45" y="205" fill="#94A3B8" font-size="11">Calendário</text>
  <text x="45" y="230" fill="#94A3B8" font-size="11">Contatos</text>
  <text x="45" y="255" fill="#94A3B8" font-size="11">Tarefas</text>
  <text x="45" y="280" fill="#94A3B8" font-size="11">Avançado</text>

  <!-- Main Section: Compose messages -->
  <rect x="195" y="132" width="520" height="175" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="210" y="152" fill="#E2E8F0" font-size="12" font-weight="bold">Redigir mensagens</text>
  <text x="210" y="170" fill="#94A3B8" font-size="11">Altere as configurações de edição e o formato das mensagens enviadas.</text>

  <!-- Signatures Button Highlighted -->
  <rect x="210" y="185" width="500" height="55" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="225" y="208" fill="#F8FAFC" font-size="11">Criar ou modificar assinaturas para mensagens:</text>
  
  <rect x="560" y="195" width="135" height="32" rx="6" fill="#10B981" opacity="0.2"/>
  <rect x="560" y="195" width="135" height="32" rx="6" stroke="#10B981" stroke-width="2" fill="none" filter="url(#glowClassic)"/>
  <text x="575" y="215" fill="#34D399" font-size="12" font-weight="bold">Assinaturas... ✍️</text>

  <!-- OK and Cancel Buttons at bottom -->
  <rect x="570" y="265" width="60" height="26" rx="4" fill="#2563EB"/>
  <text x="590" y="282" fill="#FFFFFF" font-size="11" font-weight="bold">OK</text>
  <rect x="640" y="265" width="65" height="26" rx="4" fill="#334155"/>
  <text x="653" y="282" fill="#94A3B8" font-size="11">Cancelar</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="auto" class="rounded-xl shadow-xs border border-border" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Window Header -->
  <rect x="0" y="0" width="760" height="42" fill="#1E293B" rx="10" ry="10"/>
  <rect x="0" y="32" width="760" height="10" fill="#1E293B"/>
  <circle cx="20" cy="21" r="5" fill="#EF4444"/>
  <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="21" r="5" fill="#10B981"/>
  <text x="75" y="26" fill="#94A3B8" font-size="12" font-weight="600">Novo Outlook para Windows 11 &amp; Outlook Web (OWA)</text>

  <!-- Top Right Action: Gear Icon Highlight -->
  <rect x="670" y="8" width="75" height="26" rx="6" fill="#2563EB" opacity="0.3"/>
  <rect x="670" y="8" width="75" height="26" rx="6" stroke="#60A5FA" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  <text x="682" y="25" fill="#FFFFFF" font-size="13">⚙️</text>
  <text x="702" y="25" fill="#93C5FD" font-size="11" font-weight="700">Passo 1</text>

  <!-- Settings Modal Body -->
  <rect x="25" y="55" width="710" height="265" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

  <!-- Modal Header -->
  <text x="45" y="82" fill="#FFFFFF" font-size="14" font-weight="700">Configurações</text>
  <line x1="25" y1="95" x2="735" y2="95" stroke="#334155" stroke-width="1"/>

  <!-- Left Sidebar inside Settings -->
  <rect x="25" y="95" width="160" height="225" fill="#0F172A" opacity="0.6"/>
  <text x="42" y="125" fill="#94A3B8" font-size="12">Geral</text>
  
  <!-- Active "Contas" tab -->
  <rect x="35" y="137" width="140" height="28" rx="6" fill="#2563EB"/>
  <text x="48" y="156" fill="#FFFFFF" font-size="12" font-weight="700">📁 Contas (Passo 2)</text>
  
  <text x="42" y="195" fill="#94A3B8" font-size="12">Email</text>
  <text x="42" y="225" fill="#94A3B8" font-size="12">Calendário</text>
  <text x="42" y="255" fill="#94A3B8" font-size="12">Pessoas</text>

  <!-- Middle Submenu: Signatures Option -->
  <rect x="185" y="95" width="160" height="225" fill="#1E293B"/>
  <text x="200" y="125" fill="#94A3B8" font-size="11">Gerenciar contas</text>
  <rect x="195" y="137" width="140" height="28" rx="6" fill="rgba(59,130,246,0.2)" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="208" y="156" fill="#60A5FA" font-size="12" font-weight="700">✍️ Assinaturas (Passo 3)</text>
  <text x="200" y="195" fill="#94A3B8" font-size="11">Categorias</text>
  <text x="200" y="225" fill="#94A3B8" font-size="11">Armazenamento</text>

  <!-- Main Content Panel: Signature Editor -->
  <rect x="355" y="105" width="365" height="205" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  
  <!-- New Signature Button -->
  <rect x="370" y="118" width="130" height="26" rx="5" fill="#2563EB"/>
  <text x="382" y="135" fill="#FFFFFF" font-size="11" font-weight="700">+ Nova assinatura</text>

  <!-- Signature Name input -->
  <rect x="510" y="118" width="195" height="26" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="520" y="135" fill="#94A3B8" font-size="11">Comercial 2026</text>

  <!-- Text Editor Toolbar -->
  <rect x="370" y="152" width="335" height="24" rx="4" fill="#1E293B"/>
  <text x="380" y="168" fill="#CBD5E1" font-size="11" font-weight="bold">B</text>
  <text x="395" y="168" fill="#CBD5E1" font-size="11" font-style="italic">I</text>
  <text x="410" y="168" fill="#CBD5E1" font-size="11" text-decoration="underline">U</text>
  <text x="435" y="168" fill="#94A3B8" font-size="10">Calibri</text>
  
  <!-- Highlighted Picture Icon -->
  <rect x="480" y="154" width="20" height="20" rx="3" fill="#10B981" opacity="0.3"/>
  <rect x="480" y="154" width="20" height="20" rx="3" stroke="#10B981" stroke-width="1.5" fill="none"/>
  <text x="484" y="168" fill="#34D399" font-size="11">🖼️</text>

  <!-- Editor Canvas Preview -->
  <rect x="370" y="182" width="335" height="85" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="385" y="202" fill="#E2E8F0" font-size="11" font-weight="bold">Carlos Silva | Gerente Comercial</text>
  <text x="385" y="218" fill="#94A3B8" font-size="10">contato@empresa.com.br • (11) 99999-9999</text>
  
  <!-- Mini Signature Logo Box -->
  <rect x="385" y="226" width="95" height="30" rx="3" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="392" y="244" fill="#34D399" font-size="9" font-weight="bold">PNG 300x100 (96 DPI)</text>

  <!-- Save Button -->
  <rect x="625" y="275" width="80" height="26" rx="5" fill="#10B981"/>
  <text x="643" y="292" fill="#FFFFFF" font-size="11" font-weight="bold">Salvar ✓</text>
</svg>
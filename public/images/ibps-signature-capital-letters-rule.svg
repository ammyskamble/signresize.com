<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="auto" class="rounded-xl shadow-md border border-border" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Card Header -->
  <rect x="0" y="0" width="840" height="46" fill="#1E293B" rx="8" ry="8"/>
  <circle cx="24" cy="23" r="5.5" fill="#EF4444"/>
  <circle cx="44" cy="23" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="23" r="5.5" fill="#10B981"/>
  <text x="86" y="28" fill="#F8FAFC" font-size="13" font-weight="700">IBPS Signature Rejection Clause: Cursive vs Block Letters (Annexure III)</text>
  <rect x="670" y="12" width="150" height="22" rx="11" fill="#EF4444" opacity="0.15"/>
  <text x="684" y="27" fill="#F87171" font-size="11" font-weight="700">⚠️ Strict Disqualification</text>

  <!-- Left: Accepted Cursive Signature -->
  <g transform="translate(24, 66)">
    <rect width="380" height="290" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    
    <!-- Title Banner -->
    <rect x="14" y="14" width="352" height="32" rx="6" fill="#10B981" opacity="0.15"/>
    <text x="28" y="35" fill="#34D399" font-size="13" font-weight="700">✓ ACCEPTED: Natural Running Cursive</text>

    <!-- Visual Sample Box (140x60 ratio) -->
    <rect x="50" y="62" width="280" height="120" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    
    <!-- Smooth cursive signature illustration -->
    <path d="M 75 130 C 95 90, 105 155, 125 115 C 135 95, 150 145, 170 120 C 190 100, 205 135, 230 115 C 245 105, 275 140, 305 110" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 115 150 L 265 148" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rule Bullets -->
    <text x="24" y="210" fill="#E2E8F0" font-size="12" font-weight="600">• Written in <tspan fill="#34D399">natural running handwriting</tspan></text>
    <text x="24" y="232" fill="#E2E8F0" font-size="12" font-weight="600">• Clean <tspan fill="#F8FAFC">black ballpoint ink</tspan> on unruled white paper</text>
    <text x="24" y="254" fill="#E2E8F0" font-size="12" font-weight="600">• Dimensions: <tspan fill="#A78BFA">140 × 60 pixels</tspan> · File size: <tspan fill="#34D399">10 KB – 20 KB</tspan></text>
    <text x="24" y="274" fill="#94A3B8" font-size="11">✓ Matches signature on candidate's Admit Card &amp; ID Proof</text>
  </g>

  <!-- Right: Rejected Capital / Block Letters -->
  <g transform="translate(436, 66)">
    <rect width="380" height="290" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    
    <!-- Title Banner -->
    <rect x="14" y="14" width="352" height="32" rx="6" fill="#EF4444" opacity="0.15"/>
    <text x="28" y="35" fill="#F87171" font-size="13" font-weight="700">❌ REJECTED: Capital / Block Letters</text>

    <!-- Visual Sample Box (140x60 ratio) -->
    <rect x="50" y="62" width="280" height="120" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
    
    <!-- Disqualified Block Letters Example -->
    <text x="80" y="130" fill="#EF4444" font-size="24" font-weight="900" letter-spacing="4" font-family="'Courier New', Courier, monospace">R A H U L K.</text>
    <line x1="65" y1="145" x2="315" y2="145" stroke="#EF4444" stroke-width="2"/>
    <!-- Big red cross over the sample -->
    <line x1="55" y1="67" x2="325" y2="177" stroke="#DC2626" stroke-width="3" opacity="0.45"/>
    <line x1="325" y1="67" x2="55" y2="177" stroke="#DC2626" stroke-width="3" opacity="0.45"/>

    <!-- Rule Bullets -->
    <text x="24" y="210" fill="#F87171" font-size="12" font-weight="700">• IBPS Rule: <tspan fill="#E2E8F0">Signatures in CAPITAL LETTERS will NOT be accepted</tspan></text>
    <text x="24" y="232" fill="#E2E8F0" font-size="12" font-weight="600">• Result: <tspan fill="#F87171">100% disqualification</tspan> during portal scrutiny</text>
    <text x="24" y="254" fill="#E2E8F0" font-size="12" font-weight="600">• Also Rejected: <tspan fill="#FCA5A5">Blue gel pen, initials only, or typed fonts</tspan></text>
    <text x="24" y="274" fill="#94A3B8" font-size="11">⚠️ Notification Warning: "Any candidate signing in CAPITAL letters will be cancelled"</text>
  </g>
</svg>

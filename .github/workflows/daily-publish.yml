name: Daily Content Publishing Agent

on:
  schedule:
    # Runs every day at 03:30 UTC (which is 9:00 AM Indian Standard Time)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish daily article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-daily-article.mjs

      - name: Verify build and compile routes
        run: npm run build

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain src/data/blogPostsData.ts)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/blogPostsData.ts
            git commit -m "content: automated daily preparation guide publish [skip ci]"
            git push origin main
            echo "Article committed and pushed to main."
          else
            echo "No new article changes detected. Skipping commit."
          fi

      - name: Deploy to Cloudflare Pages (Direct Wrangler if secrets present)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name signresize --branch=main --commit-dirty=true
